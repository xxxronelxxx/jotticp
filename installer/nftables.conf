#!/usr/sbin/nft -f
# JottiCP nftables firewall — applied by install.sh
# Version: 1.0.0
#
# Design decisions:
#   • Default-deny inbound — only explicitly listed ports are open
#   • Panel port 2087 is localhost-only (nginx proxies it externally on 443)
    #   • jotti-agent mTLS port 7443 is restricted to trusted management IPs only
#   • SSH is rate-limited (10 new connections/minute per source IP)
#   • ICMP is rate-limited to prevent ICMP flood
#   • FTP passive range (40000-50000) only opened when Pure-FTPd is enabled
#   • UDP 53 open for PowerDNS (split into its own rule for clarity)
#   • IPv6 handled in the same inet table via ip6 protocol rules

flush ruleset

table inet orbit_fw {

    # ── Named sets ──────────────────────────────────────────────────────────

    # Public TCP services (mail ports, HTTP/S, DNS)
    set allowed_tcp_in {
        type inet_service; flags interval;
        # 22    SSH
        # 25    SMTP (inbound mail)
        # 53    DNS (TCP zone transfers + fallback)
        # 80    HTTP (ACME challenge + redirect)
        # 443   HTTPS (panel + sites)
        # 465   SMTPS
        # 587   Submission (STARTTLS)
        # 993   IMAPS
        # 995   POPS
        elements = { 22, 25, 53, 80, 443, 465, 587, 993, 995 }
    }

    # Trusted management hosts that may reach orbit-agent on port 7443.
    # Add the orbit-panel server IP here after installation.
    # Example: nft add element inet orbit_fw mgmt_hosts { 10.0.0.1 }
    set mgmt_hosts {
        type ipv4_addr;
        flags interval;
        # Populated by install.sh and orbit-panel "Add Server" flow
    }

    set mgmt_hosts6 {
        type ipv6_addr;
        flags interval;
        # IPv6 equivalents for dual-stack environments
    }

    # ── Per-IP SSH connection tracking ────────────────────────────────────
    # Tracks new SSH connections per source IP for rate limiting.
    set ssh_rate_limit {
        type ipv4_addr;
        flags dynamic, timeout;
        timeout 60s;
    }

    # ── Inbound chain ─────────────────────────────────────────────────────

    chain inbound {
        type filter hook input priority 0; policy drop;

        # 1. Stateful: allow established/related; drop invalid
        ct state established,related accept
        ct state invalid                drop

        # 2. Loopback — fully trusted
        iifname "lo" accept

        # 3. ICMP rate limiting (IPv4)
        ip protocol icmp icmp type {
            echo-request,
            echo-reply,
            destination-unreachable,
            time-exceeded,
            parameter-problem
        } limit rate 10/second burst 20 packets accept
        ip protocol icmp drop

        # 4. ICMPv6 — required for IPv6 neighbor discovery
        ip6 nexthdr icmpv6 icmpv6 type {
            echo-request,
            echo-reply,
            destination-unreachable,
            packet-too-big,
            time-exceeded,
            parameter-problem,
            nd-router-solicit,
            nd-router-advert,
            nd-neighbor-solicit,
            nd-neighbor-advert,
            mld-listener-query,
            mld-listener-report
        } limit rate 20/second burst 40 packets accept
        ip6 nexthdr icmpv6 drop

        # 5. SSH rate limiting — drop source IPs exceeding 10 new connections/minute
        tcp dport 22 ct state new \
            limit rate over 10/minute burst 5 packets \
            add @ssh_rate_limit { ip saddr } drop comment "SSH brute-force limit"
        tcp dport 22 accept

        # 6. Panel port 2087 — localhost ONLY.
        #    nginx terminates TLS on 443 and proxies to 127.0.0.1:2087.
        #    Never expose 2087 directly; it has no TLS of its own.
        tcp dport 2087 iifname != "lo" drop comment "Panel: loopback only"

        # 7. jotti-agent mTLS gRPC — restrict to trusted management IPs.
        #    IPv4:
        tcp dport 7443 ip  saddr @mgmt_hosts  accept comment "jotti-agent: trusted panel"
        tcp dport 7443 ip6 saddr @mgmt_hosts6 accept comment "jotti-agent: trusted panel (v6)"
        tcp dport 7443 drop comment "jotti-agent: reject all other sources"

        # 8. managesieve (Dovecot) — localhost only (Sieve editor proxied by panel)
        tcp dport 4190 iifname != "lo" drop comment "managesieve: loopback only"

        # 9. Public TCP services
        tcp dport @allowed_tcp_in accept

        # 10. DNS UDP
        udp dport 53 accept

        # 11. FTP passive ports — only when Pure-FTPd is enabled per-site.
        #     Commented out by default; installer uncomments if FTP is enabled.
        # tcp dport 40000-50000 accept comment "FTP passive range"

        # 12. Drop everything else (policy drop handles this, explicit for clarity)
        drop
    }

    # ── Forward chain ─────────────────────────────────────────────────────
    # JottiCP is not a router; drop all forwarded packets.

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    # ── Outbound chain ────────────────────────────────────────────────────
    # Allow all outbound by default.
    # Tighten with specific egress rules if running a multi-tenant environment
    # where site processes should not reach internal networks.

    chain outbound {
        type filter hook output priority 0; policy accept;
    }

    # ── Postrouting (NAT placeholder) ─────────────────────────────────────
    # Uncomment and configure if the server also acts as a NAT gateway.
    # chain postrouting {
    #     type nat hook postrouting priority 100; policy accept;
    # }
}
