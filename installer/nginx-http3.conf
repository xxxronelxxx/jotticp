# HTTP/3 (QUIC) support — include this snippet inside each HTTPS server {} block
# Requires nginx compiled with --with-http_v3_module (nginx >= 1.25.0)
# or nginx-quic branch with QUIC patch applied.
#
# Usage: include /etc/nginx/conf.d/http3.conf; inside your server block.

listen 443 quic reuseport;
listen 443 ssl;
http2 on;
ssl_early_data on;

# Advertise HTTP/3 support to browsers via Alt-Svc header
add_header Alt-Svc 'h3=":443"; ma=86400' always;

# Security headers (applied to all responses)
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin always;

# QUIC-specific tuning
ssl_protocols TLSv1.3;
ssl_prefer_server_ciphers off;

# Enable 0-RTT for QUIC (requires ssl_early_data on)
# Note: 0-RTT is vulnerable to replay attacks for non-idempotent requests.
# Only enable for GET/HEAD-heavy workloads or with idempotency checks.
proxy_set_header Early-Data $ssl_early_data;
