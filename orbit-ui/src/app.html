<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="OrbitCP — web hosting control panel" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OrbitCP" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div style="display: contents">%sveltekit.body%</div>

    <!-- Register service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.warn('ServiceWorker registration failed:', err);
          });
        });
      }
    </script>

    <!-- Dev-mode performance observer: logs slow tasks and paint timing -->
    <script>
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        try {
          var po = new PerformanceObserver(function(list) {
            list.getEntries().filter(function(e) { return e.duration > 100; }).forEach(function(e) {
              console.warn('[Perf] Slow: ' + e.name + ' (' + e.duration.toFixed(0) + 'ms)');
            });
          });
          po.observe({ entryTypes: ['longtask', 'paint'] });
        } catch(e) { /* PerformanceObserver may not be available in all envs */ }
      }
    </script>
  </body>
</html>
