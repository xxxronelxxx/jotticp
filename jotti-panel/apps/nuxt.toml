# JottiCP App Manifest — Nuxt 3
# Format version: 1.0
#
# Nuxt 3 is installed via nuxi using nvm-managed Node.js.
# Requires Node.js runtime (Step 4.10). Built with nitro output
# and served via nginx reverse proxy.

[app]
id            = "nuxt"
name          = "Nuxt 3"
version       = "3.x"
category      = "framework"
description   = "Vue.js framework with SSR, SSG, and SPA support. Nitro server engine, auto-imports, file-based routing, and full-stack TypeScript."
min_disk_mb   = 400
min_memory_mb = 256
node_required = true
node_min      = "18"
node_max      = "22"
runtime       = "nodejs"
icon          = "https://nuxt.com/assets/design-kit/icon-green.svg"
docs_url      = "https://nuxt.com/docs"
license       = "MIT"
tags          = ["framework", "vue", "ssr", "ssg", "typescript", "nodejs"]

[download]
method  = "npx"
command = "nuxi@latest init . --packageManager npm --no-git-init"

[extract]
dest_dir = ""

[config]
config_path = "/home/{{unix_user}}/.env"
template = '''
NODE_ENV=production
NUXT_HOST=0.0.0.0
NUXT_PORT={{service_port}}
NUXT_SECRET={{secret_1}}
NUXT_PUBLIC_SITE_URL=https://{{domain}}
'''

[[steps]]
# Step 1: Create Nuxt 3 app via nuxi.
type      = "cli"
command   = "bash"
args      = [
    "--login", "-c",
    "source /home/{{unix_user}}/.nvm/nvm.sh && nvm use {{node_version}} && cd /home/{{unix_user}} && npx nuxi@latest init public_html --packageManager npm --no-git-init",
]
run_as    = "{{unix_user}}"
timeout_s = 300

[[steps]]
# Step 2: Install dependencies.
type      = "cli"
command   = "bash"
args      = [
    "--login", "-c",
    "source /home/{{unix_user}}/.nvm/nvm.sh && nvm use {{node_version}} && cd /home/{{unix_user}}/public_html && npm install",
]
run_as    = "{{unix_user}}"
timeout_s = 180

[[steps]]
# Step 3: Build for production (nitro output).
type      = "cli"
command   = "bash"
args      = [
    "--login", "-c",
    "source /home/{{unix_user}}/.nvm/nvm.sh && nvm use {{node_version}} && cd /home/{{unix_user}}/public_html && npm run build",
]
run_as    = "{{unix_user}}"
timeout_s = 300

[[steps]]
# Step 4: Install systemd service unit.
type = "systemd_unit"
unit_name = "nuxt-{{unix_user}}"
unit_content = '''
[Unit]
Description=Nuxt 3 — {{domain}}
After=network.target

[Service]
Type=simple
User={{unix_user}}
Group={{unix_user}}
WorkingDirectory=/home/{{unix_user}}/public_html
Environment=NODE_ENV=production
Environment=NUXT_HOST=0.0.0.0
Environment=NUXT_PORT={{service_port}}
ExecStart=/home/{{unix_user}}/.nvm/versions/node/v{{node_version}}/bin/node .output/server/index.mjs
Restart=on-failure
RestartSec=10s
Slice=website-{{unix_user}}.slice
NoNewPrivileges=yes

[Install]
WantedBy=multi-user.target
'''
enable = true
start  = true

[[steps]]
# Step 5: Write nginx reverse proxy config.
type = "nginx_proxy"
upstream_url       = "http://127.0.0.1:{{service_port}}"
proxy_read_timeout = "60s"
proxy_set_headers  = { "X-Forwarded-For" = "$proxy_add_x_forwarded_for", "X-Forwarded-Proto" = "https" }

[[steps]]
# Step 6: Initialise git repository.
type      = "cli"
command   = "/usr/bin/git"
args      = ["init", "/home/{{unix_user}}/public_html"]
run_as    = "{{unix_user}}"
timeout_s = 10

[[steps]]
type      = "cli"
command   = "/usr/bin/git"
args      = ["-C", "/home/{{unix_user}}/public_html", "add", "-A"]
run_as    = "{{unix_user}}"
timeout_s = 15

[[steps]]
type      = "cli"
command   = "/usr/bin/git"
args      = ["-C", "/home/{{unix_user}}/public_html", "commit", "-m", "Initial JottiCP install"]
run_as    = "{{unix_user}}"
timeout_s = 15

[service_port]
port_range_start = 3000
port_range_end   = 4000

[wizard]
[[wizard.fields]]
name     = "node_version"
label    = "Node.js Version"
type     = "select"
options  = ["22", "20", "18"]
default  = "20"
required = true

[post_install]
show_credentials = false
admin_url        = "https://{{domain}}"
notes            = "Nuxt 3 app built with Nitro. Service running as systemd unit nuxt-{{unix_user}}. Edit app.vue or pages/ to start building. Push via git remote to trigger rebuild."
