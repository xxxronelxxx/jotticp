# JottiCP App Manifest — n8n Workflow Automation
# Format version: 1.0
#
# n8n is installed via npm and runs as a Node.js process.
# Requires Node.js runtime (Step 4.10) — the site must use the "nodejs" runtime.
# Provisioned as a systemd service with a dedicated data directory.

[app]
id            = "n8n"
name          = "n8n"
version       = "1.43.1"
category      = "automation"
description   = "Fair-code workflow automation platform. Connect 400+ apps, build automations visually, and run AI agents. Self-hosted alternative to Zapier / Make."
min_disk_mb   = 500
min_memory_mb = 512
requires_db   = "sqlite"   # n8n defaults to SQLite; postgres supported via env var
node_required = true
node_min      = "18"
node_max      = "22"
php_min       = ""
php_max       = ""
runtime       = "nodejs"
icon          = "https://n8n.io/favicon.ico"
docs_url      = "https://docs.n8n.io/"
license       = "Sustainable Use License"
tags          = ["automation", "ai", "workflows", "nodejs", "no-code"]

[download]
# n8n is installed via npm — no archive download needed.
method = "npm"
package = "n8n"
version = "1.43.1"

[extract]
# npm install handles this; no archive extraction.
dest_dir = ""

[config]
# n8n is configured via environment variables; orbit-agent writes this .env file.
config_path = "/home/{{unix_user}}/.n8n/.env"
template = '''
# n8n environment — generated by JottiCP
N8N_HOST={{domain}}
N8N_PORT={{service_port}}
N8N_PROTOCOL=https
WEBHOOK_URL=https://{{domain}}/
N8N_EDITOR_BASE_URL=https://{{domain}}/

# Security
N8N_BASIC_AUTH_ACTIVE=true
N8N_BASIC_AUTH_USER={{admin_user}}
N8N_BASIC_AUTH_PASSWORD={{admin_password}}

# Encryption key for stored credentials — generated once, never change
N8N_ENCRYPTION_KEY={{secret_1}}

# Data directory
N8N_USER_FOLDER=/home/{{unix_user}}/.n8n

# Timezone
GENERIC_TIMEZONE=UTC

# Performance
EXECUTIONS_DATA_MAX_AGE=336
EXECUTIONS_DATA_PRUNE=true
'''

[[steps]]
# Step 1: Install n8n globally under the site unix_user via npm.
type      = "cli"
command   = "bash"
args      = [
    "--login", "-c",
    "source /home/{{unix_user}}/.nvm/nvm.sh && nvm use {{node_version}} && npm install -g n8n@{{app_version}}",
]
run_as    = "{{unix_user}}"
timeout_s = 600

[[steps]]
# Step 2: Create n8n data directory.
type  = "makedirs"
paths = ["/home/{{unix_user}}/.n8n"]
owner = "{{unix_user}}"
group = "{{unix_user}}"
mode  = "0700"

[[steps]]
# Step 3: Write systemd service unit.
type = "systemd_unit"
unit_name = "n8n-{{unix_user}}"
unit_content = '''
[Unit]
Description=n8n workflow automation — {{domain}}
After=network.target

[Service]
Type=simple
User={{unix_user}}
Group={{unix_user}}
WorkingDirectory=/home/{{unix_user}}
EnvironmentFile=/home/{{unix_user}}/.n8n/.env
ExecStart=/home/{{unix_user}}/.nvm/versions/node/v{{node_version}}/bin/n8n start
Restart=on-failure
RestartSec=10s
# Cgroup isolation
Slice=website-{{unix_user}}.slice
NoNewPrivileges=yes

[Install]
WantedBy=multi-user.target
'''
enable = true
start  = true

[[steps]]
# Step 4: Write nginx reverse proxy config.
type = "nginx_proxy"
upstream_url       = "http://127.0.0.1:{{service_port}}"
proxy_read_timeout = "120s"
proxy_set_headers  = { "X-Forwarded-For" = "$proxy_add_x_forwarded_for", "X-Forwarded-Proto" = "https" }

[service_port]
# orbit-agent allocates a free port in range 5678–6678 for n8n.
port_range_start = 5678
port_range_end   = 6678

[wizard]
[[wizard.fields]]
name        = "admin_user"
label       = "Admin Username"
type        = "text"
required    = true
max_length  = 64

[[wizard.fields]]
name        = "admin_password"
label       = "Admin Password"
type        = "password"
min_length  = 12
required    = true
auto_generate = true

[[wizard.fields]]
name        = "node_version"
label       = "Node.js Version"
type        = "select"
options     = ["20", "22", "18"]
default     = "20"
required    = true

[post_install]
show_credentials = true
admin_url        = "https://{{domain}}"
notes            = "n8n runs as a systemd service (n8n-{{unix_user}}). Basic auth protects the UI. Add SMTP settings in the n8n UI for email notifications."
