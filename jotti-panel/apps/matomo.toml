# JottiCP App Manifest — Matomo Analytics
# Format version: 1.0

[app]
id            = "matomo"
name          = "Matomo"
version       = "5.1.1"
category      = "analytics"
description   = "Privacy-first web analytics platform. GDPR-compliant alternative to Google Analytics. Full control over your visitor data — no third-party sharing."
min_disk_mb   = 300
min_memory_mb = 256
requires_db   = "mysql"
php_min       = "8.1"
php_max       = "8.4"
icon          = "https://matomo.org/wp-content/uploads/2018/11/matomo-logo.png"
docs_url      = "https://matomo.org/docs/"
license       = "GPL-3.0-or-later"
tags          = ["analytics", "privacy", "gdpr", "php"]

[download]
url    = "https://builds.matomo.org/matomo-5.1.1.tar.gz"
sha256 = "PLACEHOLDER_REPLACE_WITH_REAL_SHA256_BEFORE_PRODUCTION"

[extract]
# Archive contains a top-level "matomo/" directory.
strip_components = 1
dest_dir         = "public_html"

[database]
db_type    = "mysql"
charset    = "utf8mb4"
collation  = "utf8mb4_general_ci"

[config]
# Matomo generates config/config.ini.php during CLI install; we write a stub.
config_path = "public_html/config/config.ini.php"
template = '''
; <?php exit; ?> DO NOT REMOVE THIS LINE
; file automatically generated by JottiCP

[database]
host    = "127.0.0.1"
username = "{{db_user}}"
password = "{{db_password}}"
dbname   = "{{db_name}}"
tables_prefix = "matomo_"
charset  = "utf8mb4"
adapter  = "PDO\MYSQL"

[General]
proxy_client_headers[] = "HTTP_X_FORWARDED_FOR"
proxy_host_headers[]   = "HTTP_X_FORWARDED_HOST"
salt                   = "{{secret_1}}"
installation_in_progress = 0
'''

[[steps]]
# Step 1: Create config and tmp directories.
type  = "makedirs"
paths = [
    "/home/{{unix_user}}/public_html/config",
    "/home/{{unix_user}}/public_html/tmp",
    "/home/{{unix_user}}/public_html/tmp/assets",
    "/home/{{unix_user}}/public_html/tmp/cache",
    "/home/{{unix_user}}/public_html/tmp/logs",
    "/home/{{unix_user}}/public_html/tmp/sessions",
    "/home/{{unix_user}}/public_html/tmp/tcpdf",
    "/home/{{unix_user}}/public_html/tmp/templates_c",
]
owner = "{{unix_user}}"
group = "www-data"
mode  = "0750"

[[steps]]
# Step 2: Run Matomo CLI installer.
type      = "cli"
command   = "/usr/bin/php{{php_version}}"
args      = [
    "/home/{{unix_user}}/public_html/console",
    "installation:install",
    "--redirection-url=https://{{domain}}/",
    "--first-website-name={{site_title}}",
    "--first-website-url=https://{{domain}}/",
    "--login={{admin_user}}",
    "--password={{admin_password}}",
    "--email={{admin_email}}",
    "--force",
]
run_as    = "{{unix_user}}"
timeout_s = 300

[[steps]]
# Step 3: Set file permissions.
type      = "permissions"
path      = "/home/{{unix_user}}/public_html"
dir_mode  = "0750"
file_mode = "0640"
owner     = "{{unix_user}}"
group     = "www-data"

[[steps]]
# Step 4: Ensure tmp and config are writable.
type      = "permissions"
path      = "/home/{{unix_user}}/public_html/tmp"
dir_mode  = "0770"
file_mode = "0660"
owner     = "{{unix_user}}"
group     = "www-data"

[system_cron]
# Matomo archive cron — required for report generation.
schedule = "5 * * * *"
command  = "/usr/bin/php{{php_version}} /home/{{unix_user}}/public_html/console core:archive --url=https://{{domain}} --quiet"
run_as   = "{{unix_user}}"

[wizard]
[[wizard.fields]]
name        = "site_title"
label       = "Website Name to Track"
type        = "text"
placeholder = "My Website"
required    = true
max_length  = 128

[[wizard.fields]]
name        = "admin_user"
label       = "Admin Username"
type        = "text"
required    = true
max_length  = 100

[[wizard.fields]]
name        = "admin_password"
label       = "Admin Password"
type        = "password"
min_length  = 12
required    = true
auto_generate = true

[[wizard.fields]]
name        = "admin_email"
label       = "Admin Email"
type        = "email"
required    = true

[post_install]
show_credentials = true
admin_url        = "https://{{domain}}/index.php"
notes            = "System cron configured for report archiving. Add the Matomo tracking code to your other sites."
