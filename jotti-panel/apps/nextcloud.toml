# JottiCP App Manifest — Nextcloud
# Format version: 1.0

[app]
id            = "nextcloud"
name          = "Nextcloud"
version       = "30.0.4"
category      = "productivity"
description   = "Self-hosted file sync and collaboration platform. Drop-in replacement for Google Drive / Dropbox with calendar, contacts, and 200+ apps."
min_disk_mb   = 512
min_memory_mb = 512
requires_db   = "mysql"    # also supports postgresql
php_min       = "8.2"
php_max       = "8.4"
icon          = "https://nextcloud.com/media/logo_nextcloud_white.svg"
docs_url      = "https://docs.nextcloud.com/server/stable/admin_manual/"
license       = "AGPL-3.0-or-later"
tags          = ["cloud", "file-sync", "collaboration", "privacy"]

[download]
url    = "https://download.nextcloud.com/server/releases/nextcloud-30.0.4.tar.bz2"
sha256 = "f3a2b8c1d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1"

[extract]
# Archive contains a single top-level "nextcloud/" directory.
strip_components = 1
dest_dir         = "public_html"

[database]
db_type    = "mysql"
charset    = "utf8mb4"
collation  = "utf8mb4_bin"   # Nextcloud requires binary collation

[config]
# Nextcloud is configured via occ after extraction, not a PHP template.
# The config.php is auto-generated by the installer command.
config_path = ""
template    = ""

[[steps]]
# Step 1: Run Nextcloud CLI installer (maintenance:install).
# This creates config/config.php and initialises the database.
type      = "cli"
command   = "/usr/bin/php{{php_version}}"
args      = [
    "/home/{{unix_user}}/public_html/occ",
    "maintenance:install",
    "--database=mysql",
    "--database-host=localhost",
    "--database-name={{db_name}}",
    "--database-user={{db_user}}",
    "--database-pass={{db_password}}",
    "--admin-user={{admin_user}}",
    "--admin-pass={{admin_password}}",
    "--data-dir=/home/{{unix_user}}/nextcloud-data",
    "--no-interaction",
]
run_as    = "{{unix_user}}"
timeout_s = 300

[[steps]]
# Step 2: Set trusted domain so Nextcloud accepts requests for {{domain}}.
type      = "cli"
command   = "/usr/bin/php{{php_version}}"
args      = [
    "/home/{{unix_user}}/public_html/occ",
    "config:system:set",
    "trusted_domains", "1",
    "--value={{domain}}",
]
run_as    = "{{unix_user}}"
timeout_s = 30

[[steps]]
# Step 3: Set overwrite.cli.url and overwriteprotocol.
type      = "cli"
command   = "/usr/bin/php{{php_version}}"
args      = [
    "/home/{{unix_user}}/public_html/occ",
    "config:system:set", "overwrite.cli.url",
    "--value=https://{{domain}}",
]
run_as    = "{{unix_user}}"
timeout_s = 30

[[steps]]
# Step 4: Enable HTTPS protocol enforcement.
type      = "cli"
command   = "/usr/bin/php{{php_version}}"
args      = [
    "/home/{{unix_user}}/public_html/occ",
    "config:system:set", "overwriteprotocol",
    "--value=https",
]
run_as    = "{{unix_user}}"
timeout_s = 30

[[steps]]
# Step 5: Add recommended background job config (use cron instead of ajax).
type      = "cli"
command   = "/usr/bin/php{{php_version}}"
args      = [
    "/home/{{unix_user}}/public_html/occ",
    "background:cron",
]
run_as    = "{{unix_user}}"
timeout_s = 30

[[steps]]
# Step 6: Set file permissions per Nextcloud hardening guide.
type      = "permissions"
path      = "/home/{{unix_user}}/public_html"
dir_mode  = "0750"
file_mode = "0640"
owner     = "{{unix_user}}"
group     = "www-data"

[[steps]]
# Step 7: Data directory must NOT be inside public_html (web-accessible).
type      = "permissions"
path      = "/home/{{unix_user}}/nextcloud-data"
dir_mode  = "0750"
file_mode = "0640"
owner     = "{{unix_user}}"
group     = "www-data"

[system_cron]
# Nextcloud background jobs — must run as the web user.
schedule = "*/5 * * * *"
command  = "/usr/bin/php{{php_version}} -f /home/{{unix_user}}/public_html/cron.php"
run_as   = "{{unix_user}}"

[wizard]
[[wizard.fields]]
name        = "admin_user"
label       = "Admin Username"
type        = "text"
required    = true
max_length  = 64

[[wizard.fields]]
name        = "admin_password"
label       = "Admin Password"
type        = "password"
min_length  = 12
required    = true
auto_generate = true

[post_install]
show_credentials = true
admin_url        = "https://{{domain}}/index.php/login"
notes            = "Data directory is at /home/{{unix_user}}/nextcloud-data (outside web root). System cron is configured for background jobs."
