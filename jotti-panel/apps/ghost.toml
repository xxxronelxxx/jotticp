# JottiCP App Manifest — Ghost
# Format version: 1.0
#
# Ghost is installed via ghost-cli (npm install ghost-cli && ghost install).
# Requires Node.js runtime (Step 4.10) — the site must use the "nodejs" runtime.
# Ghost manages its own process (uses PM2 or its internal process manager).

[app]
id            = "ghost"
name          = "Ghost"
version       = "5.x"
category      = "cms"
description   = "Modern publishing platform for professional content creators. Newsletter-first CMS with built-in membership, subscriptions, and analytics."
min_disk_mb   = 500
min_memory_mb = 512
requires_db   = "mysql"
node_required = true
node_min      = "18"
node_max      = "20"
php_min       = ""
php_max       = ""
runtime       = "nodejs"
icon          = "https://ghost.org/images/logos/ghost-logo-orb.png"
docs_url      = "https://ghost.org/docs/"
license       = "MIT"
tags          = ["cms", "blog", "newsletter", "membership", "nodejs"]

[download]
# Ghost is installed via ghost-cli (npm) — no archive download.
method  = "npm"
package = "ghost-cli"
version = "latest"

[extract]
dest_dir = ""

[database]
db_type    = "mysql"
charset    = "utf8mb4"
collation  = "utf8mb4_general_ci"

[config]
# Ghost config is written by ghost-cli during `ghost install`.
# We write a config.production.json for Ghost to pick up.
config_path = "/home/{{unix_user}}/ghost/config.production.json"
template = '''
{
  "url": "https://{{domain}}",
  "server": {
    "port": {{service_port}},
    "host": "127.0.0.1"
  },
  "database": {
    "client": "mysql",
    "connection": {
      "host":     "127.0.0.1",
      "user":     "{{db_user}}",
      "password": "{{db_password}}",
      "database": "{{db_name}}",
      "charset":  "utf8mb4"
    }
  },
  "mail": {
    "transport": "SMTP",
    "options": {
      "host": "localhost",
      "port": 25,
      "auth": {
        "user": "noreply@{{domain}}",
        "pass": ""
      }
    },
    "from": "noreply@{{domain}}"
  },
  "logging": {
    "transports": ["file", "stdout"]
  },
  "process": "systemd",
  "paths": {
    "contentPath": "/home/{{unix_user}}/ghost/content"
  }
}
'''

[[steps]]
# Step 1: Install ghost-cli globally under the site unix_user.
type      = "cli"
command   = "bash"
args      = [
    "--login", "-c",
    "source /home/{{unix_user}}/.nvm/nvm.sh && nvm use {{node_version}} && npm install -g ghost-cli@latest",
]
run_as    = "{{unix_user}}"
timeout_s = 300

[[steps]]
# Step 2: Create ghost installation directory.
type  = "makedirs"
paths = [
    "/home/{{unix_user}}/ghost",
    "/home/{{unix_user}}/ghost/content",
]
owner = "{{unix_user}}"
group = "{{unix_user}}"
mode  = "0750"

[[steps]]
# Step 3: Install Ghost via ghost-cli (no-prompt mode).
type      = "cli"
command   = "bash"
args      = [
    "--login", "-c",
    "source /home/{{unix_user}}/.nvm/nvm.sh && nvm use {{node_version}} && cd /home/{{unix_user}}/ghost && ghost install --no-prompt --no-setup-nginx --no-setup-ssl --no-setup-systemd --process local --dir /home/{{unix_user}}/ghost --url https://{{domain}} --db mysql --dbhost 127.0.0.1 --dbuser {{db_user}} --dbpass {{db_password}} --dbname {{db_name}} --port {{service_port}} --no-start",
]
run_as    = "{{unix_user}}"
timeout_s = 600

[[steps]]
# Step 4: Install systemd service unit for Ghost.
type = "systemd_unit"
unit_name = "ghost-{{unix_user}}"
unit_content = '''
[Unit]
Description=Ghost CMS — {{domain}}
After=network.target mysql.service

[Service]
Type=simple
User={{unix_user}}
Group={{unix_user}}
WorkingDirectory=/home/{{unix_user}}/ghost
Environment=NODE_ENV=production
ExecStart=/home/{{unix_user}}/.nvm/versions/node/v{{node_version}}/bin/node /home/{{unix_user}}/ghost/current/index.js
Restart=on-failure
RestartSec=10s
# Cgroup isolation
Slice=website-{{unix_user}}.slice
NoNewPrivileges=yes

[Install]
WantedBy=multi-user.target
'''
enable = true
start  = true

[[steps]]
# Step 5: Write nginx reverse proxy config.
type = "nginx_proxy"
upstream_url       = "http://127.0.0.1:{{service_port}}"
proxy_read_timeout = "30s"
proxy_set_headers  = { "X-Forwarded-For" = "$proxy_add_x_forwarded_for", "X-Forwarded-Proto" = "https" }

[service_port]
# orbit-agent allocates a free port in range 2368–3368 for Ghost.
port_range_start = 2368
port_range_end   = 3368

[wizard]
[[wizard.fields]]
name        = "node_version"
label       = "Node.js Version"
type        = "select"
options     = ["20", "18"]
default     = "20"
required    = true

[post_install]
show_credentials = false
admin_url        = "https://{{domain}}/ghost"
notes            = "Ghost runs as a systemd service (ghost-{{unix_user}}). Create your admin account at /ghost on first visit. Email delivery configured via local Postfix."
