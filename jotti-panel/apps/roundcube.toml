# JottiCP App Manifest — Roundcube Webmail (standalone site install)
# Format version: 1.0
#
# This manifest installs Roundcube inside a site's public_html,
# making it available at https://{{domain}}.
#
# For the SYSTEM-LEVEL webmail service at webmail.DOMAIN (Step 3.18),
# see the system installer path — that is handled differently (not via this manifest).

[app]
id            = "roundcube"
name          = "Roundcube Webmail"
version       = "1.6.9"
category      = "email"
description   = "Fast, browser-based IMAP email client with a modern UI. Install on your own domain as a standalone webmail portal."
min_disk_mb   = 100
min_memory_mb = 64
requires_db   = "mysql"
php_min       = "8.1"
php_max       = "8.4"
icon          = "https://roundcube.net/images/roundcube_logo_icon.svg"
docs_url      = "https://github.com/roundcube/roundcubemail/wiki"
license       = "GPL-3.0-or-later"
tags          = ["email", "webmail", "imap", "php"]

[download]
url    = "https://github.com/roundcube/roundcubemail/releases/download/1.6.9/roundcubemail-1.6.9-complete.tar.gz"
sha256 = "b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3"

[extract]
# Archive contains a single "roundcubemail-1.6.9/" directory.
strip_components = 1
dest_dir         = "public_html"

[database]
db_type    = "mysql"
charset    = "utf8mb4"
collation  = "utf8mb4_general_ci"

[config]
config_path = "public_html/config/config.inc.php"
template = '''
<?php
/**
 * Roundcube Webmail Configuration — generated by JottiCP
 */

// ── Database ──────────────────────────────────────────────────────────────────
$config['db_dsnw'] = 'mysql://{{db_user}}:{{db_password}}@localhost/{{db_name}}';

// ── IMAP server ───────────────────────────────────────────────────────────────
// Point to the local Dovecot server.
$config['imap_host'] = 'ssl://localhost:993';
$config['imap_conn_options'] = [
    'ssl' => [
        'verify_peer'      => false,  // localhost cert is self-signed
        'verify_peer_name' => false,
    ],
];

// ── SMTP server ───────────────────────────────────────────────────────────────
$config['smtp_host'] = 'tls://localhost:587';
$config['smtp_user'] = '%u';     // use IMAP username for SMTP auth
$config['smtp_pass'] = '%p';

// ── Security ──────────────────────────────────────────────────────────────────
$config['des_key']          = '{{secret_1}}';   // 24-char session encryption key
$config['cipher_method']    = 'AES-256-CBC';
$config['session_lifetime'] = 10;   // minutes of inactivity before logout
$config['use_https']        = true;
$config['force_https']      = true;
$config['login_autocomplete'] = 2;  // username only autocomplete

// ── Identity ──────────────────────────────────────────────────────────────────
$config['product_name']     = '{{site_title}}';
$config['default_charset']  = 'UTF-8';
$config['language']         = null;  // auto-detect from browser

// ── UI / UX ───────────────────────────────────────────────────────────────────
$config['skin']             = 'elastic';
$config['quota_zero_as_unlimited'] = false;
$config['preview_pane']     = true;
$config['preview_pane_mark_read'] = 0;
$config['messages_cache']   = true;

// ── Plugins ───────────────────────────────────────────────────────────────────
$config['plugins'] = [
    'archive',
    'emoticons',
    'help',
    'html5_notifier',
    'identicon',
    'managesieve',  // Sieve filter UI (Step 3.15 integration)
    'markasjunk',
    'newmail_notifier',
    'password',
    'userinfo',
    'vcard_attachments',
    'zipdownload',
];

// ── managesieve plugin (Sieve filters) ────────────────────────────────────────
$config['managesieve_host']      = 'localhost';
$config['managesieve_port']      = 4190;
$config['managesieve_usetls']    = false;  // internal, no TLS needed

// ── Upload limits ─────────────────────────────────────────────────────────────
$config['max_message_size'] = '64M';

// ── Logging ───────────────────────────────────────────────────────────────────
$config['log_driver']    = 'file';
$config['log_dir']       = '/home/{{unix_user}}/logs/roundcube';
$config['log_logins']    = true;
$config['log_session']   = false;
$config['smtp_log']      = true;
$config['sql_debug']     = false;
$config['imap_debug']    = false;
'''

[[steps]]
# Step 1: Initialise the Roundcube database schema.
type      = "cli"
command   = "/usr/bin/php{{php_version}}"
args      = [
    "/home/{{unix_user}}/public_html/bin/initdb.sh",
    "--dir=/home/{{unix_user}}/public_html/SQL",
]
run_as    = "{{unix_user}}"
timeout_s = 60

[[steps]]
# Step 2: Remove installer (security requirement — blocks web access after install).
type  = "delete"
path  = "/home/{{unix_user}}/public_html/installer"

[[steps]]
# Step 3: Set permissions.
type      = "permissions"
path      = "/home/{{unix_user}}/public_html"
dir_mode  = "0750"
file_mode = "0640"
owner     = "{{unix_user}}"
group     = "www-data"

[[steps]]
# Step 4: Create logs directory (Roundcube writes here, not into public_html).
type  = "makedirs"
paths = ["/home/{{unix_user}}/logs/roundcube"]
owner = "{{unix_user}}"
group = "www-data"
mode  = "0750"

[[steps]]
# Step 5: Protect temp and logs from web access via deny rule.
# orbit-agent patches the nginx snippet for this site.
type      = "nginx_deny"
paths     = ["/temp/", "/logs/"]

[wizard]
[[wizard.fields]]
name        = "site_title"
label       = "Webmail Portal Name"
type        = "text"
placeholder = "My Webmail"
required    = true
max_length  = 64

[wizard.fields_note]
text = "No admin credentials needed — Roundcube uses your IMAP mailbox credentials to log in."

[post_install]
show_credentials = false
admin_url        = "https://{{domain}}"
notes            = "Log in with your email address and IMAP password. The /installer directory has been removed."
