syntax = "proto3";
package orbit;

// orbit-agent gRPC service definition
// Implemented by: orbit-agent (server)
// Called by: orbit-panel (client)
//
// All connections MUST use mTLS — the client (orbit-panel) and server (orbit-agent)
// both present certificates signed by the OrbitCP internal CA.
// Unauthenticated connections are rejected at the TLS handshake layer.

service Agent {
  // Site lifecycle
  rpc CreateSite(CreateSiteRequest)               returns (SiteResponse);
  rpc DeleteSite(DeleteSiteRequest)               returns (StatusResponse);
  rpc SuspendSite(SuspendSiteRequest)             returns (StatusResponse);
  rpc UnsuspendSite(UnsuspendSiteRequest)         returns (StatusResponse);

  // PHP-FPM pool management
  rpc CreatePhpFpmPool(PhpFpmPoolRequest)         returns (StatusResponse);
  rpc DeletePhpFpmPool(DeletePhpFpmPoolRequest)   returns (StatusResponse);
  rpc ReloadPhpFpmPool(ReloadPhpFpmPoolRequest)   returns (StatusResponse);

  // cgroup v2 resource limits
  rpc SetCgroupLimits(CgroupLimitsRequest)        returns (StatusResponse);
  rpc GetCgroupStats(GetCgroupStatsRequest)       returns (CgroupStatsResponse);

  // Web server management
  rpc ReloadWebServer(ReloadWebServerRequest)     returns (StatusResponse);
  rpc GetSiteStats(GetSiteStatsRequest)           returns (SiteStatsResponse);

  // Database management (MySQL, PostgreSQL)
  rpc CreateDatabase(CreateDatabaseRequest)       returns (DatabaseResponse);
  rpc DeleteDatabase(DeleteDatabaseRequest)       returns (StatusResponse);

  // DNS zone files (for servers running PowerDNS)
  rpc CreateDnsZone(CreateDnsZoneRequest)         returns (StatusResponse);
  rpc DeleteDnsZone(DeleteDnsZoneRequest)         returns (StatusResponse);
  rpc UpsertDnsRecord(DnsRecordRequest)           returns (StatusResponse);
  rpc DeleteDnsRecord(DeleteDnsRecordRequest)     returns (StatusResponse);

  // PHP extension management
  rpc UpdatePhpExtensions(UpdatePhpExtensionsRequest) returns (StatusResponse);

  // Web server vhost management
  rpc CreateVhost(CreateVhostRequest)             returns (StatusResponse);
  rpc DeleteVhost(DeleteVhostRequest)             returns (StatusResponse);

  // SSL certificate deployment
  rpc InstallSslCert(InstallSslCertRequest)       returns (StatusResponse);
  rpc RemoveSslCert(RemoveSslCertRequest)         returns (StatusResponse);

  // Disk quota management
  rpc SetDiskQuota(SetDiskQuotaRequest)           returns (StatusResponse);

  // Backup operations
  rpc TriggerBackup(TriggerBackupRequest)         returns (TriggerBackupResponse);
  rpc GetBackupStatus(GetBackupStatusRequest)     returns (BackupStatusResponse);

  // File operations (for app installer, site migration)
  rpc ExtractArchive(ExtractArchiveRequest)       returns (StatusResponse);
  rpc RunCommand(RunCommandRequest)               returns (RunCommandResponse);

  // Real-time metrics streaming (for dashboard)
  rpc StreamMetrics(StreamMetricsRequest)         returns (stream MetricsUpdate);

  // System information
  rpc GetSystemInfo(Empty)                        returns (SystemInfoResponse);
  rpc GetDiskUsage(GetDiskUsageRequest)           returns (DiskUsageResponse);

  // Connectivity test (used by panel to verify agent reachability)
  rpc Ping(Empty)                                 returns (PingResponse);

  // Language runtime provisioning (Steps 4.9–4.12)
  rpc SetupPythonSite(SetupPythonSiteRequest)     returns (StatusResponse);
  rpc SetupNodejsSite(SetupNodejsSiteRequest)     returns (StatusResponse);
  rpc SetupRubySite(SetupRubySiteRequest)         returns (StatusResponse);
  rpc SetupDotnetSite(SetupDotnetSiteRequest)     returns (StatusResponse);
}

// ── Site messages ─────────────────────────────────────────────────────────────

message CreateSiteRequest {
  string domain       = 1;  // "example.com"
  string php_version  = 2;  // "8.3"
  string web_server   = 3;  // "ols" | "nginx" | "apache" | "lse"
  int64  disk_quota_mb = 4; // 0 = unlimited
}

message SiteResponse {
  string site_id    = 1;  // same as domain (used as primary key on agent)
  string status     = 2;  // "active" | "error"
  string unix_user  = 3;  // "orbit_example_com"
  string error_msg  = 4;  // non-empty on error
}

message DeleteSiteRequest {
  string domain      = 1;
  bool   delete_files = 2;  // if true, rm -rf /home/unix_user/
}

message SuspendSiteRequest {
  string domain = 1;
}

message UnsuspendSiteRequest {
  string domain = 1;
}

// ── PHP-FPM messages ──────────────────────────────────────────────────────────

message PhpFpmPoolRequest {
  string domain       = 1;
  string php_version  = 2;  // "8.3"
  string unix_user    = 3;
  string socket_path  = 4;  // "/run/php/orbit_example.sock"
  int32  max_children = 5;  // pm.max_children (0 = use default)
  int64  memory_limit_mb = 6;  // PHP memory_limit in MB (0 = use default 256)
}

message DeletePhpFpmPoolRequest {
  string domain      = 1;
  string php_version = 2;
}

message ReloadPhpFpmPoolRequest {
  string domain      = 1;
  string php_version = 2;
}

// ── cgroup v2 messages ────────────────────────────────────────────────────────

message CgroupLimitsRequest {
  string domain              = 1;
  uint64 memory_max_bytes    = 2;  // 0 = unlimited (memory.max = max)
  uint32 cpu_quota_percent   = 3;  // 0 = unlimited, 25 = 25% of one CPU
  uint32 pids_max            = 4;  // 0 = use default (100)
  uint64 io_read_bps_max     = 5;  // 0 = unlimited
  uint64 io_write_bps_max    = 6;  // 0 = unlimited
}

message GetCgroupStatsRequest {
  string domain = 1;
}

message CgroupStatsResponse {
  uint64 memory_current    = 1;  // bytes, from memory.current
  uint64 memory_max        = 2;  // bytes limit, from memory.max
  uint64 cpu_usage_usec    = 3;  // from cpu.stat usage_usec
  uint32 pids_current      = 4;  // from pids.current
  uint32 pids_max          = 5;  // limit
}

// ── Web server messages ───────────────────────────────────────────────────────

message ReloadWebServerRequest {
  string web_server = 1;  // "ols" | "nginx" | "apache" | "lse" | "" (all)
}

message GetSiteStatsRequest {
  string domain = 1;
}

message SiteStatsResponse {
  uint64 memory_current  = 1;  // cgroup memory bytes
  uint64 cpu_usage_ns    = 2;  // cumulative CPU nanoseconds
  uint64 disk_bytes      = 3;  // site root disk usage
  uint64 net_rx_bytes    = 4;  // received bytes (daily)
  uint64 net_tx_bytes    = 5;  // transmitted bytes (daily)
  int64  request_count   = 6;  // requests in last 24h (from access log)
}

// ── Database messages ─────────────────────────────────────────────────────────

message CreateDatabaseRequest {
  string db_type     = 1;  // "mysql" | "mariadb" | "postgresql" | "ferretdb" | "surrealdb"
  string db_name     = 2;
  string db_user     = 3;
  string db_password = 4;
}

message DatabaseResponse {
  string connection_string = 1;  // "mysql://user:pass@127.0.0.1:3306/dbname"
  bool   success           = 2;
  string error_msg         = 3;
}

message DeleteDatabaseRequest {
  string db_type = 1;
  string db_name = 2;
  string db_user = 3;
}

// ── DNS messages ──────────────────────────────────────────────────────────────

message CreateDnsZoneRequest {
  string zone    = 1;  // "example.com."
  string ns1     = 2;
  string ns2     = 3;
  string admin   = 4;  // SOA admin email
}

message DeleteDnsZoneRequest {
  string zone = 1;
}

message DnsRecordRequest {
  string zone     = 1;  // "example.com." (zone the record belongs to)
  string name     = 2;  // record name, FQDN or relative ("@" for apex)
  string rtype    = 3;  // "A" | "AAAA" | "CNAME" | "MX" | "TXT" | "SRV" | ...
  string content  = 4;  // record value (without priority for MX/SRV)
  int32  ttl      = 5;
  int32  priority = 6;  // MX/SRV priority (ignored for other types)
}

message DeleteDnsRecordRequest {
  string zone  = 1;
  string name  = 2;
  string rtype = 3;
}

// ── File operation messages ───────────────────────────────────────────────────

message ExtractArchiveRequest {
  string archive_path  = 1;  // absolute path to .tar.gz or .zip
  string dest_path     = 2;  // extract to this directory
  string unix_user     = 3;  // chown extracted files to this user
}

// RunCommand: executes a command as a specific Unix user — NEVER via shell.
// The command and args are passed as an array (no shell interpolation possible).
// This is structurally immune to shell injection (Command::new API).
message RunCommandRequest {
  string unix_user   = 1;  // run as this user (must exist on system)
  string command     = 2;  // absolute path to binary: "/usr/local/bin/wp"
  repeated string args = 3;  // argument array — no shell metacharacters
  string working_dir = 4;  // working directory
  uint32 timeout_sec = 5;  // 0 = use default (60s)
}

message RunCommandResponse {
  bool   success    = 1;
  int32  exit_code  = 2;
  string stdout     = 3;  // max 4KB returned
  string stderr     = 4;  // max 4KB returned
}

// ── Streaming metrics ─────────────────────────────────────────────────────────

message StreamMetricsRequest {
  uint32 interval_ms = 1;  // update interval in milliseconds (minimum: 1000)
}

message MetricsUpdate {
  int64  timestamp_ms     = 1;  // unix milliseconds
  float  cpu_pct          = 2;  // 0.0–100.0
  float  ram_pct          = 3;  // 0.0–100.0
  uint64 ram_used_bytes   = 4;
  uint64 ram_total_bytes  = 5;
  uint64 disk_read_kbps   = 6;
  uint64 disk_write_kbps  = 7;
  uint64 net_rx_kbps      = 8;
  uint64 net_tx_kbps      = 9;
  float  load_1           = 10;
  float  load_5           = 11;
  float  load_15          = 12;
}

// ── System info messages ──────────────────────────────────────────────────────

message SystemInfoResponse {
  string hostname       = 1;
  string os_version     = 2;   // "Ubuntu 24.04.2 LTS"
  string kernel         = 3;   // "6.8.0-51-generic"
  uint64 ram_total      = 4;   // bytes
  uint64 ram_free       = 5;   // bytes
  float  cpu_count      = 6;   // logical CPU cores
  string architecture   = 7;   // "x86_64"
  uint64 uptime_seconds = 8;
  string orbit_agent_version = 9;
}

message GetDiskUsageRequest {
  string path = 1;  // directory to measure (empty = /)
}

message DiskUsageResponse {
  uint64 total_bytes = 1;
  uint64 used_bytes  = 2;
  uint64 free_bytes  = 3;
  float  used_pct    = 4;  // 0.0–100.0
}

// ── Shared messages ───────────────────────────────────────────────────────────

message StatusResponse {
  bool   success = 1;
  string message = 2;
}

message Empty {}

// ── PHP extension messages ────────────────────────────────────────────────────

message UpdatePhpExtensionsRequest {
  string domain      = 1;  // site domain
  string php_version = 2;  // "8.3"
  repeated string enable  = 3;  // extension names to enable (e.g. "imagick", "redis")
  repeated string disable = 4;  // extension names to disable
}

// ── Vhost messages ────────────────────────────────────────────────────────────

message CreateVhostRequest {
  string domain      = 1;
  string unix_user   = 2;
  string web_server  = 3;  // "nginx" | "ols" | "apache" | "lse"
  string php_version = 4;
  bool   ssl_active  = 5;
  bool   suspended   = 6;
  int32  pm_max_children = 7;  // 0 = use default
  string memory_limit    = 8;  // "256M"
}

message DeleteVhostRequest {
  string domain     = 1;
  string web_server = 2;
}

// ── SSL cert deployment messages ──────────────────────────────────────────────

message InstallSslCertRequest {
  string domain       = 1;
  string cert_pem     = 2;  // full chain PEM
  string key_pem      = 3;  // private key PEM
  string chain_pem    = 4;  // intermediate chain PEM (optional)
  bool   reload_web   = 5;  // if true, reload web server after install
}

message RemoveSslCertRequest {
  string domain     = 1;
  bool   reload_web = 2;
}

// ── Disk quota messages ───────────────────────────────────────────────────────

message SetDiskQuotaRequest {
  string unix_user     = 1;
  uint64 soft_limit_mb = 2;  // 0 = use hard_limit_mb (standard: soft=90% of hard)
  uint64 hard_limit_mb = 3;  // 0 = unlimited
}

// ── Backup messages ───────────────────────────────────────────────────────────

message TriggerBackupRequest {
  string site_id      = 1;  // matches sites.id
  string unix_user    = 2;
  string backup_type  = 3;  // "full" | "files" | "database"
  string destination  = 4;  // "local" | "s3" | "sftp"
  string backup_id    = 5;  // UUID assigned by panel — stored in manifest.json
}

message TriggerBackupResponse {
  bool   accepted  = 1;  // false if another backup is already running for this site
  string job_token = 2;  // opaque token used to poll GetBackupStatus
  string error_msg = 3;
}

message GetBackupStatusRequest {
  string job_token = 1;
}

message BackupStatusResponse {
  string status       = 1;  // "pending" | "running" | "complete" | "failed"
  uint64 size_bytes   = 2;
  string storage_path = 3;  // local path or remote key
  string error_msg    = 4;
  int64  started_at   = 5;  // unix millis
  int64  completed_at = 6;  // unix millis; 0 if not yet complete
}

// ── Ping response ─────────────────────────────────────────────────────────────

message PingResponse {
  string version    = 1;  // orbit-agent version string
  int64  server_time = 2; // unix milliseconds — useful for clock skew detection
}

// ── Language runtime messages (Steps 4.9–4.12) ────────────────────────────────

message SetupPythonSiteRequest {
  string site_id        = 1;  // UUID — used for port allocation and systemd unit name
  string domain         = 2;
  string unix_user      = 3;
  string python_version = 4;  // "3.12" | "3.11" | "3.10" | "" (use system python3)
}

message SetupNodejsSiteRequest {
  string site_id       = 1;
  string domain        = 2;
  string unix_user     = 3;
  string node_version  = 4;  // "20" | "22" | "18" (major version for nvm)
}

message SetupRubySiteRequest {
  string site_id       = 1;
  string domain        = 2;
  string unix_user     = 3;
  string ruby_version  = 4;  // "3.3" | "3.3.0"
}

message SetupDotnetSiteRequest {
  string site_id        = 1;
  string domain         = 2;
  string unix_user      = 3;
  string dotnet_version = 4;  // "8" | "9" — .NET Core/5+ ONLY, not Framework
}
