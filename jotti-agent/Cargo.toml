[package]
name        = "jotti-agent"
version     = "0.0.1"
edition     = "2021"
authors     = ["Development SPB <support@dev-spb.ru>"]
description = "JottiCP managed-server agent — gRPC/mTLS, runs on each managed server"
license     = "AGPL-3.0-or-later"

[[bin]]
name = "jotti-agent"
path = "src/main.rs"

[dependencies]
# gRPC / protobuf
tonic         = { workspace = true }
prost         = { workspace = true }

# Async runtime
tokio         = { workspace = true }
tokio-stream  = { workspace = true }
futures-util  = { workspace = true }

# Serialization
serde         = { workspace = true }
serde_json    = { workspace = true }

# Error handling
anyhow        = { workspace = true }
thiserror     = { workspace = true }

# Logging / tracing
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
uuid    = { workspace = true }
chrono  = { workspace = true }
rand    = { workspace = true }
regex    = { workspace = true }
once_cell = { workspace = true }

# mTLS
rustls         = "0.23"
tokio-rustls   = "0.26"
rustls-pemfile = "2"

# SQLite local journal (for replay safety)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json"] }

# System operations
nix = { version = "0.29", features = ["user", "process", "fs"] }

# Archive extraction
tar    = "0.4"
flate2 = "1"
zip    = "2"

# HTTP (for OLS/LSE API calls)
reqwest = { workspace = true }

# SHA-256 for backup manifests
sha2 = { workspace = true }
hex  = { workspace = true }

# dotenvy for .env support
dotenvy = { workspace = true }

[build-dependencies]
tonic-build = "0.12"
