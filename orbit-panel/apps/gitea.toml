# OrbitCP App Manifest — Gitea
# Format version: 1.0
#
# NOTE: Gitea is a Go binary, not a PHP app.
# orbit-agent provisions it as a systemd service (not PHP-FPM).
# A reverse proxy (nginx) forwards traffic from HTTPS → Gitea HTTP port.

[app]
id            = "gitea"
name          = "Gitea"
version       = "1.22.6"
category      = "development"
description   = "Lightweight self-hosted Git service written in Go. GitHub-like interface with issues, pull requests, Actions CI, and package registry."
min_disk_mb   = 200
min_memory_mb = 256
requires_db   = "mysql"    # also supports postgresql
php_min       = ""         # not a PHP app
php_max       = ""
runtime       = "binary"   # Go binary installed as systemd service
icon          = "https://gitea.io/images/gitea.png"
docs_url      = "https://docs.gitea.com/"
license       = "MIT"
tags          = ["git", "devops", "ci", "go", "self-hosted"]

[download]
url    = "https://dl.gitea.com/gitea/1.22.6/gitea-1.22.6-linux-amd64"
sha256 = "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
# Binary download — not an archive.
is_archive = false

[extract]
# Not an archive; installer copies the binary directly.
dest_path = "/home/{{unix_user}}/bin/gitea"
mode      = "0750"

[database]
db_type    = "mysql"
charset    = "utf8mb4"
collation  = "utf8mb4_general_ci"

[config]
config_path = "/home/{{unix_user}}/gitea/custom/conf/app.ini"
template = '''
; Gitea configuration — generated by OrbitCP

APP_NAME = {{site_title}}
RUN_USER = {{unix_user}}
RUN_MODE = prod
WORK_PATH = /home/{{unix_user}}/gitea

[repository]
ROOT = /home/{{unix_user}}/gitea/repositories

[repository.local]
LOCAL_COPY_PATH = /tmp/{{unix_user}}/gitea-local-repo

[server]
PROTOCOL         = http
DOMAIN           = {{domain}}
HTTP_ADDR        = 127.0.0.1
HTTP_PORT        = {{service_port}}
ROOT_URL         = https://{{domain}}/
DISABLE_SSH      = false
SSH_DOMAIN       = {{domain}}
SSH_PORT         = 22
LFS_START_SERVER = true
LFS_JWT_SECRET   = {{secret_1}}
OFFLINE_MODE     = false

[database]
DB_TYPE  = mysql
HOST     = 127.0.0.1:3306
NAME     = {{db_name}}
USER     = {{db_user}}
PASSWD   = {{db_password}}
CHARSET  = utf8mb4
SSL_MODE = disable
LOG_SQL  = false

[security]
INSTALL_LOCK          = true
SECRET_KEY            = {{secret_2}}
INTERNAL_TOKEN        = {{secret_3}}
PASSWORD_HASH_ALGO    = argon2

[service]
DISABLE_REGISTRATION              = false
REQUIRE_SIGNIN_VIEW               = false
REGISTER_EMAIL_CONFIRM            = false
ENABLE_NOTIFY_MAIL                = false
NO_REPLY_ADDRESS                  = noreply@{{domain}}
DEFAULT_ORG_VISIBILITY            = private

[mailer]
ENABLED    = true
FROM       = noreply@{{domain}}
PROTOCOL   = smtp
SMTP_ADDR  = localhost
SMTP_PORT  = 25

[cache]
ADAPTER  = memory
INTERVAL = 60

[log]
MODE      = file
LEVEL     = info
ROOT_PATH = /home/{{unix_user}}/gitea/log

[picture]
AVATAR_UPLOAD_PATH = /home/{{unix_user}}/gitea/data/avatars
'''

[[steps]]
# Step 1: Create required Gitea directory structure.
type = "makedirs"
paths = [
    "/home/{{unix_user}}/gitea/custom/conf",
    "/home/{{unix_user}}/gitea/data/avatars",
    "/home/{{unix_user}}/gitea/repositories",
    "/home/{{unix_user}}/gitea/log",
    "/home/{{unix_user}}/bin",
]
owner = "{{unix_user}}"
group = "{{unix_user}}"
mode  = "0750"

[[steps]]
# Step 2: Run Gitea DB migration (initialises schema).
type      = "cli"
command   = "/home/{{unix_user}}/bin/gitea"
args      = [
    "migrate",
    "--config=/home/{{unix_user}}/gitea/custom/conf/app.ini",
]
run_as    = "{{unix_user}}"
env       = { GITEA_WORK_DIR = "/home/{{unix_user}}/gitea" }
timeout_s = 120

[[steps]]
# Step 3: Create first admin user via CLI.
type      = "cli"
command   = "/home/{{unix_user}}/bin/gitea"
args      = [
    "admin", "user", "create",
    "--admin",
    "--username={{admin_user}}",
    "--password={{admin_password}}",
    "--email={{admin_email}}",
    "--must-change-password=false",
    "--config=/home/{{unix_user}}/gitea/custom/conf/app.ini",
]
run_as    = "{{unix_user}}"
env       = { GITEA_WORK_DIR = "/home/{{unix_user}}/gitea" }
timeout_s = 60

[[steps]]
# Step 4: Install systemd service unit for Gitea.
type = "systemd_unit"
unit_name = "gitea-{{unix_user}}"
unit_content = '''
[Unit]
Description=Gitea — {{domain}}
After=network.target

[Service]
Type=simple
User={{unix_user}}
Group={{unix_user}}
WorkingDirectory=/home/{{unix_user}}/gitea
ExecStart=/home/{{unix_user}}/bin/gitea web --config /home/{{unix_user}}/gitea/custom/conf/app.ini
Restart=on-failure
RestartSec=5s
Environment=GITEA_WORK_DIR=/home/{{unix_user}}/gitea
# cgroup slice for resource isolation
Slice=website-{{unix_user}}.slice
PrivateTmp=yes
NoNewPrivileges=yes

[Install]
WantedBy=multi-user.target
'''
enable  = true
start   = true

[[steps]]
# Step 5: Write nginx snippet to proxy to Gitea HTTP port.
type = "nginx_proxy"
upstream_url   = "http://127.0.0.1:{{service_port}}"
# proxy_read_timeout extended for long-running git push/pull operations.
proxy_read_timeout = "300s"

[service_port]
# orbit-agent allocates a free port in range 10000-19999 and injects it as {{service_port}}.
port_range_start = 10000
port_range_end   = 19999

[wizard]
[[wizard.fields]]
name        = "site_title"
label       = "Gitea Instance Name"
type        = "text"
placeholder = "My Git Server"
required    = true
max_length  = 128

[[wizard.fields]]
name        = "admin_user"
label       = "Admin Username"
type        = "text"
required    = true
max_length  = 40

[[wizard.fields]]
name        = "admin_password"
label       = "Admin Password"
type        = "password"
min_length  = 12
required    = true
auto_generate = true

[[wizard.fields]]
name      = "admin_email"
label     = "Admin Email"
type      = "email"
required  = true

[post_install]
show_credentials = true
admin_url        = "https://{{domain}}"
notes            = "Gitea runs as a systemd service (gitea-{{unix_user}}). SSH push uses port 22 with your normal SSH key."
