# OrbitCP App Manifest — Laravel
# Format version: 1.0
#
# Laravel is installed via Composer (create-project).
# Requires PHP 8.2+ and Composer to be present on the server.
# The site uses PHP-FPM (standard PHP runtime — not a Node/Python runtime).

[app]
id            = "laravel"
name          = "Laravel"
version       = "11.x"
category      = "framework"
description   = "Elegant PHP web application framework. Artisan CLI, Eloquent ORM, Blade templates, queues, events, and a rich ecosystem. The most popular PHP framework."
min_disk_mb   = 300
min_memory_mb = 128
requires_db   = "mysql"    # also supports postgresql and sqlite
php_min       = "8.2"
php_max       = "8.4"
php_required  = true
icon          = "https://laravel.com/img/logotype.min.svg"
docs_url      = "https://laravel.com/docs/11.x"
license       = "MIT"
tags          = ["framework", "php", "artisan", "eloquent", "rest-api"]

[download]
# Installed via composer create-project — no archive download.
method  = "composer"
package = "laravel/laravel"
version = "^11.0"

[extract]
# Composer installs directly into public_html; no archive to extract.
dest_dir = ""

[database]
db_type    = "mysql"
charset    = "utf8mb4"
collation  = "utf8mb4_unicode_ci"

[config]
# Laravel uses .env for configuration.
config_path = "public_html/.env"
template = '''
APP_NAME="{{site_title}}"
APP_ENV=production
APP_KEY=base64:{{secret_1}}
APP_DEBUG=false
APP_URL=https://{{domain}}

LOG_CHANNEL=daily
LOG_LEVEL=error
LOG_DEPRECATIONS_CHANNEL=null

DB_CONNECTION=mysql
DB_HOST=127.0.0.1
DB_PORT=3306
DB_DATABASE={{db_name}}
DB_USERNAME={{db_user}}
DB_PASSWORD={{db_password}}

BROADCAST_DRIVER=log
CACHE_DRIVER=file
FILESYSTEM_DISK=local
QUEUE_CONNECTION=database
SESSION_DRIVER=database
SESSION_LIFETIME=120
SESSION_ENCRYPT=true

MAIL_MAILER=smtp
MAIL_HOST=localhost
MAIL_PORT=25
MAIL_USERNAME=null
MAIL_PASSWORD=null
MAIL_ENCRYPTION=null
MAIL_FROM_ADDRESS="noreply@{{domain}}"
MAIL_FROM_NAME="${APP_NAME}"
'''

[[steps]]
# Step 1: Install Laravel via Composer.
type      = "cli"
command   = "/usr/bin/composer"
args      = [
    "create-project",
    "laravel/laravel",
    "/home/{{unix_user}}/public_html",
    "^11.0",
    "--no-interaction",
    "--prefer-dist",
    "--no-dev",
]
run_as    = "{{unix_user}}"
timeout_s = 300

[[steps]]
# Step 2: Generate application key.
type      = "cli"
command   = "/usr/bin/php{{php_version}}"
args      = [
    "/home/{{unix_user}}/public_html/artisan",
    "key:generate",
    "--force",
]
run_as    = "{{unix_user}}"
timeout_s = 30

[[steps]]
# Step 3: Run database migrations.
type      = "cli"
command   = "/usr/bin/php{{php_version}}"
args      = [
    "/home/{{unix_user}}/public_html/artisan",
    "migrate",
    "--force",
    "--no-interaction",
]
run_as    = "{{unix_user}}"
timeout_s = 120

[[steps]]
# Step 4: Optimise for production (config + route caching).
type      = "cli"
command   = "/usr/bin/php{{php_version}}"
args      = [
    "/home/{{unix_user}}/public_html/artisan",
    "optimize",
]
run_as    = "{{unix_user}}"
timeout_s = 60

[[steps]]
# Step 5: Set file permissions — storage and cache must be writable.
type      = "permissions"
path      = "/home/{{unix_user}}/public_html"
dir_mode  = "0750"
file_mode = "0640"
owner     = "{{unix_user}}"
group     = "www-data"

[[steps]]
# Step 6: Make storage and bootstrap/cache writable.
type      = "permissions"
path      = "/home/{{unix_user}}/public_html/storage"
dir_mode  = "0770"
file_mode = "0660"
owner     = "{{unix_user}}"
group     = "www-data"

[[steps]]
type      = "permissions"
path      = "/home/{{unix_user}}/public_html/bootstrap/cache"
dir_mode  = "0770"
file_mode = "0660"
owner     = "{{unix_user}}"
group     = "www-data"

[[steps]]
# Step 7: Initialise git repository (standard for Laravel projects).
type    = "cli"
command = "/usr/bin/git"
args    = ["init", "/home/{{unix_user}}/public_html"]
run_as  = "{{unix_user}}"
timeout_s = 10

[system_cron]
# Laravel task scheduler — all scheduled tasks run through this single cron entry.
schedule = "* * * * *"
command  = "/usr/bin/php{{php_version}} /home/{{unix_user}}/public_html/artisan schedule:run --quiet"
run_as   = "{{unix_user}}"

[wizard]
[[wizard.fields]]
name        = "site_title"
label       = "Application Name"
type        = "text"
placeholder = "My Laravel App"
required    = true
max_length  = 64

[post_install]
show_credentials = false
admin_url        = "https://{{domain}}"
notes            = "Laravel application installed. System cron configured for task scheduler. Storage and bootstrap/cache are writable. Git repository initialised."
