# OrbitCP App Manifest — Django
# Format version: 1.0
#
# Django is installed via pip into the site's .venv virtualenv.
# Requires Python runtime (Step 4.9). Served by Gunicorn behind nginx.
# Database required (PostgreSQL recommended; MySQL supported).

[app]
id              = "django"
name            = "Django"
version         = "5.x"
category        = "framework"
description     = "Python web framework — batteries included. ORM, admin interface, migrations, auth, forms, and 25+ years of production hardening."
min_disk_mb     = 150
min_memory_mb   = 256
python_required = true
python_min      = "3.11"
requires_db     = "postgresql"
runtime         = "python"
icon            = "https://www.djangoproject.com/m/img/logos/django-logo-negative.svg"
docs_url        = "https://docs.djangoproject.com/en/5.0/"
license         = "BSD-3-Clause"
tags            = ["framework", "python", "orm", "rest-api", "admin"]

[download]
method  = "pip"
command = "pip install Django gunicorn psycopg2-binary whitenoise"

[extract]
dest_dir = ""

[config]
config_path = "/home/{{unix_user}}/.env"
template = '''
DJANGO_SECRET_KEY={{secret_1}}
DJANGO_SETTINGS_MODULE=app.settings
DEBUG=False
ALLOWED_HOSTS={{domain}}
DATABASE_URL=postgresql://{{db_user}}:{{db_password}}@127.0.0.1:5432/{{db_name}}
STATIC_ROOT=/home/{{unix_user}}/public_html/staticfiles
'''

[[steps]]
# Step 1: Create virtualenv for the site user.
type      = "cli"
command   = "/usr/bin/python3"
args      = ["-m", "venv", "/home/{{unix_user}}/.venv"]
run_as    = "{{unix_user}}"
timeout_s = 60

[[steps]]
# Step 2: Install Django and production dependencies.
type      = "cli"
command   = "bash"
args      = [
    "-c",
    "source /home/{{unix_user}}/.venv/bin/activate && pip install --quiet Django gunicorn psycopg2-binary whitenoise python-decouple",
]
run_as    = "{{unix_user}}"
timeout_s = 180

[[steps]]
# Step 3: Create Django project skeleton.
type      = "cli"
command   = "bash"
args      = [
    "-c",
    "source /home/{{unix_user}}/.venv/bin/activate && cd /home/{{unix_user}}/public_html && django-admin startproject app .",
]
run_as    = "{{unix_user}}"
timeout_s = 30

[[steps]]
# Step 4: Run database migrations.
type      = "cli"
command   = "bash"
args      = [
    "-c",
    "source /home/{{unix_user}}/.venv/bin/activate && source /home/{{unix_user}}/.env && cd /home/{{unix_user}}/public_html && python manage.py migrate --no-input",
]
run_as    = "{{unix_user}}"
timeout_s = 120

[[steps]]
# Step 5: Collect static files.
type      = "cli"
command   = "bash"
args      = [
    "-c",
    "source /home/{{unix_user}}/.venv/bin/activate && source /home/{{unix_user}}/.env && cd /home/{{unix_user}}/public_html && python manage.py collectstatic --no-input",
]
run_as    = "{{unix_user}}"
timeout_s = 60

[[steps]]
# Step 6: Install systemd service unit for Gunicorn.
type = "systemd_unit"
unit_name = "django-{{unix_user}}"
unit_content = '''
[Unit]
Description=Django (Gunicorn) — {{domain}}
After=network.target postgresql.service

[Service]
Type=simple
User={{unix_user}}
Group={{unix_user}}
WorkingDirectory=/home/{{unix_user}}/public_html
EnvironmentFile=/home/{{unix_user}}/.env
ExecStart=/home/{{unix_user}}/.venv/bin/gunicorn app.wsgi:application \
    --bind 127.0.0.1:{{service_port}} \
    --workers 3 \
    --timeout 60 \
    --access-logfile - \
    --error-logfile -
Restart=on-failure
RestartSec=10s
Slice=website-{{unix_user}}.slice
NoNewPrivileges=yes

[Install]
WantedBy=multi-user.target
'''
enable = true
start  = true

[[steps]]
# Step 7: Write nginx reverse proxy config (also serves /static/).
type = "nginx_proxy"
upstream_url       = "http://127.0.0.1:{{service_port}}"
proxy_read_timeout = "60s"
static_root        = "/home/{{unix_user}}/public_html/staticfiles"
static_url_prefix  = "/static/"
proxy_set_headers  = { "X-Forwarded-For" = "$proxy_add_x_forwarded_for", "X-Forwarded-Proto" = "https" }

[[steps]]
# Step 8: Initialise git repository.
type      = "cli"
command   = "/usr/bin/git"
args      = ["init", "/home/{{unix_user}}/public_html"]
run_as    = "{{unix_user}}"
timeout_s = 10

[[steps]]
type      = "cli"
command   = "/usr/bin/git"
args      = ["-C", "/home/{{unix_user}}/public_html", "add", "-A"]
run_as    = "{{unix_user}}"
timeout_s = 15

[[steps]]
type      = "cli"
command   = "/usr/bin/git"
args      = ["-C", "/home/{{unix_user}}/public_html", "commit", "-m", "Initial OrbitCP install"]
run_as    = "{{unix_user}}"
timeout_s = 15

[service_port]
port_range_start = 8000
port_range_end   = 9000

[wizard]
[[wizard.fields]]
name        = "db_name"
label       = "Database Name"
type        = "text"
placeholder = "django_app"
required    = true

[post_install]
show_credentials = false
admin_url        = "https://{{domain}}/admin"
notes            = "Django project created. Update app/settings.py with your database settings. Run 'python manage.py createsuperuser' to create an admin account. Gunicorn running as systemd unit django-{{unix_user}}."
