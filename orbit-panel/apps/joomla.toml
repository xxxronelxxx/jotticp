# OrbitCP App Manifest — Joomla
# Format version: 1.0

[app]
id            = "joomla"
name          = "Joomla"
version       = "5.2.3"
category      = "cms"
description   = "Feature-rich open-source CMS powering government, educational, and enterprise websites. Stronger built-in access control than WordPress."
min_disk_mb   = 300
min_memory_mb = 128
requires_db   = "mysql"
php_min       = "8.1"
php_max       = "8.4"
icon          = "https://www.joomla.org/images/joomla_logo_black.png"
docs_url      = "https://docs.joomla.org/"
license       = "GPL-2.0-or-later"
tags          = ["cms", "enterprise", "multilingual", "php"]

[download]
url    = "https://downloads.joomla.org/cms/joomla5/5-2-3/Joomla_5-2-3-Stable-Full_Package.tar.bz2"
sha256 = "e2b4a7c1d3f8e9a2b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8"

[extract]
# Joomla archives extract to the current directory (no top-level wrapper).
strip_components = 0
dest_dir         = "public_html"

[database]
db_type    = "mysql"
charset    = "utf8mb4"
collation  = "utf8mb4_unicode_ci"

[config]
# Joomla uses configuration.php; orbit-agent writes it after extraction.
config_path = "public_html/configuration.php"
template = '''
<?php
/**
 * Joomla! configuration — generated by OrbitCP
 */
class JConfig {
    // ── Database ────────────────────────────────────────────────────────────
    public $dbtype    = 'mysqli';
    public $host      = 'localhost';
    public $user      = '{{db_user}}';
    public $password  = '{{db_password}}';
    public $db        = '{{db_name}}';
    public $dbprefix  = 'jos_';
    public $dbencryption = 0;

    // ── Site ─────────────────────────────────────────────────────────────────
    public $sitename  = '{{site_title}}';
    public $sef       = '1';
    public $sef_rewrite = '1';
    public $sef_suffix = '0';
    public $unicodeslugs = '0';

    // ── Paths ─────────────────────────────────────────────────────────────────
    public $live_site  = 'https://{{domain}}';
    public $log_path   = '/home/{{unix_user}}/logs';
    public $tmp_path   = '/tmp/{{unix_user}}';

    // ── Security ──────────────────────────────────────────────────────────────
    public $secret    = '{{secret_1}}';
    public $force_ssl = '2';  // Force SSL on entire site (2 = whole site)

    // ── Cache ─────────────────────────────────────────────────────────────────
    public $caching     = '0';
    public $cachetime   = '15';
    public $cache_handler = 'file';

    // ── Mail ──────────────────────────────────────────────────────────────────
    public $mailer       = 'smtp';
    public $mailfrom     = 'noreply@{{domain}}';
    public $fromname     = '{{site_title}}';
    public $smtpauth     = '0';
    public $smtphost     = 'localhost';
    public $smtpport     = '25';
    public $smtpsecure   = 'none';

    // ── Debug (disabled in production) ────────────────────────────────────────
    public $debug        = '0';
    public $error_reporting = 'default';
    public $helpurl      = 'https://help.joomla.org/proxy?keyref=Help{major}{minor}:{keyref}&lang={langcode}';

    // ── Meta ──────────────────────────────────────────────────────────────────
    public $MetaDesc  = '';
    public $robots    = '';
}
'''

[[steps]]
# Step 1: Run Joomla CLI installer (Joomla 4.2+ ships installation/joomla.php CLI).
type      = "cli"
command   = "/usr/bin/php{{php_version}}"
args      = [
    "/home/{{unix_user}}/public_html/installation/joomla.php",
    "install",
    "--site-name={{site_title}}",
    "--admin-user={{admin_user}}",
    "--admin-username={{admin_user}}",
    "--admin-password={{admin_password}}",
    "--admin-email={{admin_email}}",
    "--db-type=mysqli",
    "--db-host=localhost",
    "--db-user={{db_user}}",
    "--db-pass={{db_password}}",
    "--db-name={{db_name}}",
    "--db-prefix=jos_",
    "--db-encryption=0",
    "--no-interaction",
]
run_as    = "{{unix_user}}"
timeout_s = 180

[[steps]]
# Step 2: Remove installation directory (security requirement).
type = "delete"
path = "/home/{{unix_user}}/public_html/installation"

[[steps]]
# Step 3: Set correct file permissions.
type      = "permissions"
path      = "/home/{{unix_user}}/public_html"
dir_mode  = "0750"
file_mode = "0640"
owner     = "{{unix_user}}"
group     = "www-data"

[wizard]
[[wizard.fields]]
name        = "site_title"
label       = "Site Name"
type        = "text"
placeholder = "My Joomla Site"
required    = true
max_length  = 128

[[wizard.fields]]
name        = "admin_user"
label       = "Admin Username"
type        = "text"
required    = true
max_length  = 150

[[wizard.fields]]
name        = "admin_password"
label       = "Admin Password"
type        = "password"
min_length  = 12
required    = true
auto_generate = true

[[wizard.fields]]
name        = "admin_email"
label       = "Admin Email"
type        = "email"
required    = true

[post_install]
show_credentials = true
admin_url        = "https://{{domain}}/administrator"
notes            = "The /installation directory has been removed as required by Joomla security guidelines."
