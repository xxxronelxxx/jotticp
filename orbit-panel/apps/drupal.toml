# OrbitCP App Manifest — Drupal
# Format version: 1.0

[app]
id            = "drupal"
name          = "Drupal"
version       = "11.0.5"
category      = "cms"
description   = "Enterprise-grade open-source CMS. Highly flexible with a powerful configuration management system. Trusted by governments, universities, and large organisations."
min_disk_mb   = 400
min_memory_mb = 256
requires_db   = "mysql"    # also supports postgresql
php_min       = "8.3"
php_max       = "8.4"
icon          = "https://www.drupal.org/files/druplicon-small.png"
docs_url      = "https://www.drupal.org/docs"
license       = "GPL-2.0-or-later"
tags          = ["cms", "enterprise", "government", "php", "multilingual"]

[download]
url    = "https://www.drupal.org/download-latest/tar.gz"
# Pinned to 11.0.5; replace url and sha256 when upgrading.
sha256 = "PLACEHOLDER_REPLACE_WITH_REAL_SHA256_BEFORE_PRODUCTION"

[extract]
# Archive contains "drupal-11.0.5/" top-level directory.
strip_components = 1
dest_dir         = "public_html"

[database]
db_type    = "mysql"
charset    = "utf8mb4"
collation  = "utf8mb4_general_ci"

[config]
# Drupal 8+ uses settings.php; orbit-agent renders this after extraction.
config_path = "public_html/sites/default/settings.php"
template = '''
<?php

/**
 * Drupal settings — generated by OrbitCP
 * https://www.drupal.org/docs/getting-started/installing-drupal
 */

$databases['default']['default'] = [
  'database'  => '{{db_name}}',
  'username'  => '{{db_user}}',
  'password'  => '{{db_password}}',
  'host'      => '127.0.0.1',
  'port'      => '3306',
  'driver'    => 'mysql',
  'prefix'    => '',
  'collation' => 'utf8mb4_general_ci',
];

$settings['hash_salt']               = '{{secret_1}}';
$settings['update_free_access']      = FALSE;
$settings['trusted_host_patterns'][] = '^{{domain|preg_quote}}$';
$settings['trusted_host_patterns'][] = '^www\.{{domain|preg_quote}}$';

$config_directories[CONFIG_SYNC_DIRECTORY] = '/home/{{unix_user}}/config/sync';

# File system
$settings['file_public_path']  = 'sites/default/files';
$settings['file_private_path'] = '/home/{{unix_user}}/private';
$settings['file_temp_path']    = '/tmp/{{unix_user}}';

# Performance
$settings['container_yamls'][] = $app_root . '/' . $site_path . '/services.yml';
$config['system.performance']['css']['preprocess']  = TRUE;
$config['system.performance']['js']['preprocess']   = TRUE;

# Reverse proxy — orbit-panel sits behind nginx
$settings['reverse_proxy']         = TRUE;
$settings['reverse_proxy_addresses']= ['127.0.0.1'];
'''

[[steps]]
# Step 1: Prepare writable directories required by Drupal.
type  = "makedirs"
paths = [
    "/home/{{unix_user}}/public_html/sites/default/files",
    "/home/{{unix_user}}/private",
    "/home/{{unix_user}}/config/sync",
    "/tmp/{{unix_user}}",
]
owner = "{{unix_user}}"
group = "www-data"
mode  = "0750"

[[steps]]
# Step 2: Copy default.settings.php → settings.php (config template written above).
type      = "copy"
src       = "/home/{{unix_user}}/public_html/sites/default/default.settings.php"
dst       = "/home/{{unix_user}}/public_html/sites/default/settings.php"
run_as    = "{{unix_user}}"

[[steps]]
# Step 3: Run Drupal CLI installer (Drush site:install).
# Drush must be installed via Composer in the site root.
type      = "cli"
command   = "/home/{{unix_user}}/public_html/vendor/bin/drush"
args      = [
    "site:install", "standard",
    "--db-url=mysql://{{db_user}}:{{db_password}}@127.0.0.1/{{db_name}}",
    "--site-name={{site_title}}",
    "--account-name={{admin_user}}",
    "--account-pass={{admin_password}}",
    "--account-mail={{admin_email}}",
    "--yes",
    "--root=/home/{{unix_user}}/public_html",
]
run_as    = "{{unix_user}}"
timeout_s = 300

[[steps]]
# Step 4: Set correct file permissions (Drupal security checklist).
type      = "permissions"
path      = "/home/{{unix_user}}/public_html"
dir_mode  = "0750"
file_mode = "0640"
owner     = "{{unix_user}}"
group     = "www-data"

[[steps]]
# Step 5: Make files/ directory and settings.php writable by web user.
type      = "permissions"
path      = "/home/{{unix_user}}/public_html/sites/default/files"
dir_mode  = "0770"
file_mode = "0660"
owner     = "{{unix_user}}"
group     = "www-data"

[system_cron]
# Drupal cron — run every 3 hours via system cron.
schedule = "0 */3 * * *"
command  = "/home/{{unix_user}}/public_html/vendor/bin/drush cron --root=/home/{{unix_user}}/public_html --quiet"
run_as   = "{{unix_user}}"

[wizard]
[[wizard.fields]]
name        = "site_title"
label       = "Site Name"
type        = "text"
placeholder = "My Drupal Site"
required    = true
max_length  = 128

[[wizard.fields]]
name        = "admin_user"
label       = "Admin Username"
type        = "text"
required    = true
max_length  = 60

[[wizard.fields]]
name        = "admin_password"
label       = "Admin Password"
type        = "password"
min_length  = 12
required    = true
auto_generate = true

[[wizard.fields]]
name        = "admin_email"
label       = "Admin Email"
type        = "email"
required    = true

[post_install]
show_credentials = true
admin_url        = "https://{{domain}}/user/login"
notes            = "System cron is configured. Private files directory is at /home/{{unix_user}}/private (outside web root)."
