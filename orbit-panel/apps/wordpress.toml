# OrbitCP App Manifest — WordPress
# Format version: 1.0

[app]
id            = "wordpress"
name          = "WordPress"
version       = "6.7.2"
category      = "cms"
description   = "The world's most popular CMS. Powers 43% of the web. Ideal for blogs, business sites, and WooCommerce stores."
min_disk_mb   = 250
min_memory_mb = 128
requires_db   = "mysql"   # also works with mariadb
php_min       = "8.1"
php_max       = "8.4"
icon          = "https://s.w.org/style/images/about/WordPress-logotype-wmark.png"
docs_url      = "https://wordpress.org/documentation/"
license       = "GPL-2.0-or-later"
tags          = ["cms", "blog", "woocommerce", "php"]

[download]
url    = "https://wordpress.org/wordpress-6.7.2.tar.gz"
# SHA-256 verified against https://wordpress.org/wordpress-6.7.2.tar.gz.sha256
sha256 = "cfd9c83cfa9dda0351898ea9b73f58995c817994a5424be18777f83e886a3cf6"

[extract]
# Archive contains a single top-level "wordpress/" directory.
# Strip that prefix and extract directly into public_html.
strip_components = 1
dest_dir         = "public_html"

[database]
# orbit-agent creates this DB and user before running config steps.
db_type        = "mysql"
charset        = "utf8mb4"
collation      = "utf8mb4_unicode_ci"

[config]
# orbit-agent renders this template and writes it to config_path.
config_path = "public_html/wp-config.php"
template = '''
<?php
/**
 * WordPress Configuration — generated by OrbitCP
 * https://developer.wordpress.org/advanced-administration/wordpress/wp-config/
 */

// ── Database ────────────────────────────────────────────────────────────────
define( 'DB_NAME',     '{{db_name}}' );
define( 'DB_USER',     '{{db_user}}' );
define( 'DB_PASSWORD', '{{db_password}}' );
define( 'DB_HOST',     'localhost' );
define( 'DB_CHARSET',  'utf8mb4' );
define( 'DB_COLLATE',  '' );

// ── Authentication keys and salts ────────────────────────────────────────────
// Generated uniquely at install time. Do not reuse across sites.
define( 'AUTH_KEY',         '{{secret_1}}' );
define( 'SECURE_AUTH_KEY',  '{{secret_2}}' );
define( 'LOGGED_IN_KEY',    '{{secret_3}}' );
define( 'NONCE_KEY',        '{{secret_4}}' );
define( 'AUTH_SALT',        '{{secret_5}}' );
define( 'SECURE_AUTH_SALT', '{{secret_6}}' );
define( 'LOGGED_IN_SALT',   '{{secret_7}}' );
define( 'NONCE_SALT',       '{{secret_8}}' );

// ── Table prefix ─────────────────────────────────────────────────────────────
$table_prefix = 'wp_';

// ── URLs ─────────────────────────────────────────────────────────────────────
define( 'WP_HOME',    'https://{{domain}}' );
define( 'WP_SITEURL', 'https://{{domain}}' );

// ── File paths ───────────────────────────────────────────────────────────────
define( 'WP_CONTENT_DIR', '/home/{{unix_user}}/public_html/wp-content' );
define( 'WP_CONTENT_URL', 'https://{{domain}}/wp-content' );

// ── Performance ──────────────────────────────────────────────────────────────
define( 'WP_CACHE',             true );
define( 'WP_MEMORY_LIMIT',      '{{memory_limit}}' );
define( 'WP_MAX_MEMORY_LIMIT',  '{{memory_limit}}' );

// ── System cron (disable HTTP cron — orbit-cron handles wp-cron) ─────────────
define( 'DISABLE_WP_CRON', true );

// ── Security ─────────────────────────────────────────────────────────────────
define( 'DISALLOW_FILE_EDIT', true );
define( 'FORCE_SSL_ADMIN',    true );

// ── Debug (disabled in production) ───────────────────────────────────────────
define( 'WP_DEBUG',         false );
define( 'WP_DEBUG_LOG',     false );
define( 'WP_DEBUG_DISPLAY', false );
@ini_set( 'display_errors', 0 );

// ── Absolute path ────────────────────────────────────────────────────────────
if ( ! defined( 'ABSPATH' ) ) {
    define( 'ABSPATH', __DIR__ . '/' );
}
require_once ABSPATH . 'wp-settings.php';
'''

[[steps]]
# Step 1: Run WP-CLI core install (creates DB tables + first admin user).
# orbit-agent runs this via RunCommand RPC as unix_user (never root).
type       = "cli"
command    = "/usr/local/bin/wp"
args       = [
    "core", "install",
    "--url=https://{{domain}}",
    "--title={{site_title}}",
    "--admin_user={{admin_user}}",
    "--admin_password={{admin_password}}",
    "--admin_email={{admin_email}}",
    "--skip-email",
    "--path=/home/{{unix_user}}/public_html",
]
run_as     = "{{unix_user}}"
timeout_s  = 120

[[steps]]
# Step 2: Enable search engine indexing (public site).
type       = "cli"
command    = "/usr/local/bin/wp"
args       = [
    "option", "update", "blog_public", "1",
    "--path=/home/{{unix_user}}/public_html",
]
run_as     = "{{unix_user}}"
timeout_s  = 30

[[steps]]
# Step 3: Add system cron entry for wp-cron (replaces HTTP cron trigger).
type       = "cli"
command    = "/usr/local/bin/wp"
args       = [
    "cron", "event", "run", "--due-now",
    "--path=/home/{{unix_user}}/public_html",
]
run_as     = "{{unix_user}}"
timeout_s  = 30

[[steps]]
# Step 4: Set correct file permissions (group-readable, not world-writable).
type    = "permissions"
path    = "/home/{{unix_user}}/public_html"
dir_mode  = "0750"
file_mode = "0640"
owner     = "{{unix_user}}"
group     = "www-data"

[system_cron]
# wp-cron runs every 5 minutes via system cron instead of HTTP.
# orbit-agent writes this entry to the site crontab.
schedule = "*/5 * * * *"
command  = "/usr/local/bin/wp cron event run --due-now --path=/home/{{unix_user}}/public_html --quiet"
run_as   = "{{unix_user}}"

[wizard]
# Fields shown in the installer UI wizard.
[[wizard.fields]]
name        = "site_title"
label       = "Site Title"
type        = "text"
placeholder = "My WordPress Site"
required    = true
max_length  = 128

[[wizard.fields]]
name        = "admin_user"
label       = "Admin Username"
type        = "text"
placeholder = "admin"
required    = true
max_length  = 60

[[wizard.fields]]
name        = "admin_password"
label       = "Admin Password"
type        = "password"
min_length  = 12
required    = true
auto_generate = true

[[wizard.fields]]
name        = "admin_email"
label       = "Admin Email"
type        = "email"
required    = true

[post_install]
show_credentials = true
admin_url        = "https://{{domain}}/wp-admin"
notes            = "System wp-cron is configured. HTTP wp-cron is disabled for performance."
