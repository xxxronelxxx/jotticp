{
  /* ── Database ── */
  SOGoProfileURL          = "postgresql://sogo:sogo_pass@127.0.0.1:5432/sogo/sogo_user_profile";
  OCSFolderInfoURL        = "postgresql://sogo:sogo_pass@127.0.0.1:5432/sogo/sogo_folder_info";
  OCSSessionsFolderURL    = "postgresql://sogo:sogo_pass@127.0.0.1:5432/sogo/sogo_sessions_folder";
  OCSEMailAlarmsFolderURL = "postgresql://sogo:sogo_pass@127.0.0.1:5432/sogo/sogo_alarms_folder";

  /* ── User source (SQL via sogo_users table) ── */
  SOGoUserSources = (
    {
      type               = sql;
      id                 = directory;
      viewURL            = "postgresql://sogo:sogo_pass@127.0.0.1:5432/sogo/sogo_users";
      canAuthenticate    = YES;
      isAddressBook      = YES;
      userPasswordAlgorithm = plain;
      loginFields        = (mail);
      mailFields         = (mail);
      CNFieldName        = c_cn;
      IDFieldName        = c_uid;
      UIDFieldName       = c_uid;
      displayName        = "OrbitCP Mail Users";
    }
  );

  /* ── Mail ── */
  SOGoIMAPServer              = "imap://127.0.0.1:143";
  SOGoSMTPServer              = "smtp://127.0.0.1:25";
  SOGoMailingMechanism        = smtp;
  SOGoDraftsFolderName        = Drafts;
  SOGoSentFolderName          = Sent;
  SOGoTrashFolderName         = Trash;
  SOGoJunkFolderName          = Junk;
  SOGoIMAPAclConformsToIMAPExt = YES;
  NGImap4AuthMechanism        = "plain";
  SOGoForceExternalLoginWithEmail = NO;
  SOGoMailSpoolPath           = /var/spool/sogo;

  /* ── Session caching ── */
  SOGoMemcachedHost           = "127.0.0.1";

  /* ── Web server / process ── */
  WOPort                      = 127.0.0.1:20000;
  WOWorkersCount              = 3;
  WOPidFile                   = "/var/run/sogo/sogo.pid";
  WOLogFile                   = "/var/log/sogo/sogo.log";
  SxVMemLimit                 = 384;

  /* ── UI / Branding ── */
  SOGoPageTitle               = "OrbitCP Webmail";
  SOGoLanguage                = English;
  SOGoTimeZone                = UTC;

  /* ── Features ── */
  SOGoPasswordChangeEnabled       = YES;
  SOGoVacationEnabled             = YES;
  SOGoForwardEnabled              = YES;
  SOGoMailAuxiliaryUserAccountsEnabled = YES;
  SOGoCalendarDefaultRoles        = (PublicDAndTViewer, ConfidentialDAndTViewer);

  /* ── Security ── */
  SOGoXSRFValidationEnabled   = YES;
  SOGoTrustProxyAuthentication = NO;
  SOGoDisableSharing          = NO;
}
