server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Panel REST API
    location /api/ {
        proxy_pass         http://127.0.0.1:2087;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 100M;
    }

    # WebSocket metrics
    location /ws/ {
        proxy_pass         http://127.0.0.1:2087;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400s;
    }

    # JWKS / well-known
    location /.well-known/ {
        proxy_pass http://127.0.0.1:2087;
        proxy_set_header Host $host;
    }

    root /var/www;

    # SOGo static assets — ^~ ensures this beats /SOGo prefix match
    # SOGo generates URLs as /SOGo.woa/WebServerResources/ (GNUstep WOA naming)
    location ^~ /SOGo.woa/WebServerResources/ {
        alias /usr/lib/GNUstep/SOGo/WebServerResources/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        access_log off;
    }

    # SSO bridge (PHP) — before the SOGo proxy catch-all
    location ~ ^/webmail/sso\.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
        fastcgi_param REQUEST_URI     $request_uri;
    }

    # /webmail/ -> SOGo proxy
    location = /webmail {
        return 301 /webmail/;
    }

    location /webmail/ {
        rewrite ^/webmail/(.*)$ /SOGo/$1 break;
        proxy_pass         http://127.0.0.1:20000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
        proxy_busy_buffers_size 256k;
        proxy_set_header   x-webobjects-remote-user "";
        proxy_set_header   x-webobjects-remote-addr $remote_addr;
        proxy_set_header   x-webobjects-server-name $host;
        proxy_set_header   x-webobjects-server-port $server_port;
    }

    # SOGo direct path
    location /SOGo {
        proxy_pass         http://127.0.0.1:20000/SOGo;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
        proxy_busy_buffers_size 256k;
        proxy_set_header   x-webobjects-remote-user "";
        proxy_set_header   x-webobjects-remote-addr $remote_addr;
        proxy_set_header   x-webobjects-server-name $host;
        proxy_set_header   x-webobjects-server-port $server_port;
    }

    # Ledjo static assets
    location /ledjo/build/ {
        alias /var/www/ledjo/public/build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Ledjo ERP (Laravel)
    location /ledjo/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
    }

    # SvelteKit frontend (everything else)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name admin.jotti.ru;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              admin.jotti.ru;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

