server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Panel REST API
    location = /health {
        proxy_pass http://127.0.0.1:2087/health;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:2087/health/ready;
        access_log off;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:2087;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 100M;
    }

    # WebSocket metrics
    location /ws/ {
        proxy_pass         http://127.0.0.1:2087;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400s;
    }

    # JWKS / well-known
    location /.well-known/ {
        proxy_pass http://127.0.0.1:2087;
        proxy_set_header Host $host;
    }

    root /var/www;

    # ── Roundcube webmail ────────────────────────────────────────────────────
    # SSO bridge (lives outside /usr/share/roundcube/ at /var/www/webmail/sso.php)
    location = /webmail/sso.php {
        root /var/www;
        rewrite ^/webmail/sso.php$ /webmail/sso.php break;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/webmail/sso.php;
    }

    # Static + PHP for Roundcube
    location /webmail/ {
        alias /usr/share/roundcube/;
        index index.php;

        # Block sensitive internals
        location ~ ^/webmail/(config|temp|logs|installer|bin|SQL|vendor)(/|$) {
            deny all;
        }

        # PHP files — strip the /webmail prefix so SCRIPT_FILENAME lands inside /usr/share/roundcube/
        location ~ ^/webmail/(.+?\.php)(/.*)?$ {
            alias /usr/share/roundcube/$1;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param SCRIPT_NAME     /webmail/$1;
            fastcgi_param PATH_INFO       $2;
            fastcgi_read_timeout 300;
        }

        # Static (CSS / JS / images / fonts) — cache long
        location ~* ^/webmail/.*\.(css|js|svg|png|jpe?g|gif|ico|woff2?|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Default fallback (e.g. /webmail/ → index.php)
        try_files $uri $uri/ /webmail/index.php?$args;
    }

    location = /webmail {
        return 301 /webmail/;
    }

    # SSO bridge (separate PHP file in /var/www/webmail/sso.php)
    location ~ ^/webmail/sso\.php$ {
        alias /var/www/webmail/sso.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }

    # Ledjo static assets
    location /ledjo/build/ {
        alias /var/www/ledjo/public/build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Ledjo ERP (Laravel)
    location /ledjo/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
    }

    # SvelteKit frontend (everything else)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name admin.jotti.ru;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              admin.jotti.ru;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

