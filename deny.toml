[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "OpenSSL", "AGPL-3.0-or-later", "MPL-2.0"]
deny = ["GPL-2.0", "SSPL-1.0"]

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl", reason = "Use rustls instead" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
