[package]
name        = "orbit-cron"
version     = "0.1.0"
edition     = "2021"
description = "OrbitCP cron daemon — SSL renewal, backups, DNSBL checks, metrics collection"
license     = "AGPL-3.0-or-later"

[[bin]]
name = "orbit-cron"
path = "src/main.rs"

[dependencies]
tokio         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
anyhow        = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy       = { workspace = true }
sqlx          = { workspace = true }
chrono        = { workspace = true }
uuid          = { workspace = true }
thiserror     = { workspace = true }
tonic         = { workspace = true }
prost         = { workspace = true }

# Valkey / Redis — pinned to workspace version to avoid duplicate compiled crate
redis = { workspace = true }

# DNS resolution for DNSBL checks
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }

[build-dependencies]
tonic-build = "0.12"
