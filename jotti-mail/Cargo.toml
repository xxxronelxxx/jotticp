[package]
name        = "jotti-mail"
version     = "0.0.1"
edition     = "2021"
authors     = ["Development SPB <support@dev-spb.ru>"]
description = "JottiCP mail daemon — Postfix + Dovecot + rspamd management"
license     = "AGPL-3.0-or-later"

[[bin]]
name = "jotti-mail"
path = "src/main.rs"

[dependencies]
axum              = { workspace = true }
tokio             = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
anyhow            = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy           = { workspace = true }
uuid              = { workspace = true }
thiserror         = { workspace = true }
tower-http        = { workspace = true }
regex             = "1"
